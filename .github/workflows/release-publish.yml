name: Release publish

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (Beta is published as prerelease)'
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Beta
      version:
        description: 'Version to release (e.g., 2.14.2)'
        required: true
        type: string
      draft:
        description: 'Keep the release as a draft'
        required: true
        default: true
        type: boolean

jobs:
  build:
    strategy:
      matrix:
        include:
          - configuration: ${{ inputs.configuration }}
            architecture: x64
          - configuration: ${{ inputs.configuration }}
            architecture: ARM64
      fail-fast: false

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: ${{ matrix.configuration }}
      architecture: ${{ matrix.architecture }}
    secrets: inherit

  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: git-cliff

      - name: Normalize version
        id: ver
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          version="${RAW_VERSION#v}"
          version="${version#V}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create local release tag
        run: git tag -f "v${{ steps.ver.outputs.version }}"

      - name: Determine changelog range
        id: range
        # 只统计本仓库自己的提交，不把上游 PCL CE 的历史改动写进更新说明。
        # FORK_BASE 是分叉时上游的最后一个提交；若之后合并了上游分支，把它更新为合并前上游的最后一个提交。
        env:
          FORK_BASE: 8f0beaf9
        run: |
          base=$(git describe --tags --match "v[0-9]*" --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$base" ] || ! git merge-base --is-ancestor "$FORK_BASE" "$base"; then
            base="$FORK_BASE"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: git-cliff "${{ steps.range.outputs.base }}..v${{ steps.ver.outputs.version }}" -o CHANGELOG.md

      - name: Create or update release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: ${{ inputs.draft }}
          tag_name: v${{ steps.ver.outputs.version }}
          name: Release ${{ steps.ver.outputs.version }}
          body_path: CHANGELOG.md
          prerelease: ${{ inputs.configuration == 'Beta' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rename_and_release:
    needs: [build, changelog]
    permissions:
      actions: read
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - configuration: ${{ inputs.configuration }}
            architecture: x64
          - configuration: ${{ inputs.configuration }}
            architecture: ARM64
    steps:
      - name: Normalize version
        id: ver
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          version="${RAW_VERSION#v}"
          version="${version#V}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PCL_CE_ZIT_Studio_Unlock_${{ matrix.configuration }}_${{ matrix.architecture }}
          path: ./artifact

      - name: Rename binaries
        run: |
          mv "./artifact/Plain Craft Launcher 2.exe" "PCL_CE_ZIT_Studio_Unlock_${{ matrix.configuration }}_${{ matrix.architecture }}.exe"

      - name: Sign the binary
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: PCL_CE_ZIT_Studio_Unlock_${{ matrix.configuration }}_${{ matrix.architecture }}.exe
          verify: true
          verify-cert-identity: https://github.com/zitzhen/PCL-CE-Unlock/.github/workflows/release-publish.yml@refs/heads/main
          verify-oidc-issuer: https://token.actions.githubusercontent.com

      - name: Upload binary and signature to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: ${{ inputs.draft }}
          tag_name: v${{ steps.ver.outputs.version }}
          files: |
            PCL_CE_ZIT_Studio_Unlock_${{ matrix.configuration }}_${{ matrix.architecture }}.exe
            PCL_CE_ZIT_Studio_Unlock_${{ matrix.configuration }}_${{ matrix.architecture }}.exe.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
